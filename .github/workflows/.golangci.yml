name: golangci-lint
on:
  push:
    branches:
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@latest

      - name: Generate mocks
        run: go generate ./...
        
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
